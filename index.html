<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donkey Balls - Countdown</title>
    <style>
        /* Black, Green, and White Theme */
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            color: #00ff41; /* Vibrant Green */
            border: 3px solid #00ff41;
            padding: 10px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .route {
            color: #aaaaaa;
            font-size: 1rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .photos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Avatar Styles replacing standard image tags */
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #00ff41;
            background-color: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem; /* Makes the emoji large like an avatar */
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
            user-select: none;
        }

        .icon {
            font-size: 2.5rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Countdown Container */
        .countdown-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .time-box {
            background-color: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            min-width: 75px;
            border-bottom: 4px solid #00ff41;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .time-box span {
            display: block;
            font-size: 3rem;
            font-weight: bold;
        }

        .time-box p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00ff41;
        }

        .message {
            font-size: 1.5rem;
            color: #ffffff;
            margin-top: 20px;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="logo">Donkey Balls</div>
    <h1 id="main-heading">Waiting for Des</h1>
    <div class="route">Pietermaritzburg ✈️ JNB</div>

    <div class="photos">
        <!-- Using native emojis for avatars (Silver hair man, Brunette woman) -->
        <div class="avatar" title="Des">👨‍🦳</div>
        <span class="icon">✈️</span>
        <div class="avatar" title="Bern">👩🏽</div>
    </div>

    <div class="countdown-container" id="timer">
        <div class="time-box"><span id="days">00</span><p>Days</p></div>
        <div class="time-box"><span id="hours">00</span><p>Hours</p></div>
        <div class="time-box"><span id="mins">00</span><p>Mins</p></div>
        <div class="time-box"><span id="secs">00</span><p>Secs</p></div>
    </div>

    <div class="message" id="dynamic-message">Counting down to touchdown...</div>

    <script>
        // Set the Landing Time (Tuesday, Sept 8 at 8:45 AM)
        const landingDate = new Date("Sep 8, 2026 08:45:00").getTime();
        
        // Set the Return Flight Time (Monday, Sept 14 at 16:30)
        const departureDate = new Date("Sep 14, 2026 16:30:00").getTime();

        const x = setInterval(function() {
            const now = new Date().getTime();
            let targetDate = landingDate;

            // Phase 2: He has landed, count down to departure
            if (now > landingDate && now < departureDate) {
                targetDate = departureDate;
                document.getElementById('main-heading').innerText = "Time Together";
                document.querySelector('.icon').innerText = "❤️";
                document.getElementById('dynamic-message').innerText = "Make every second count!";
            } 
            // Phase 3: The visit is over
            else if (now > departureDate) {
                clearInterval(x);
                document.getElementById("timer").innerHTML = "<h2 style='color:#00ff41;'>Until next time!</h2>";
                document.getElementById('main-heading').innerText = "See you soon";
                document.getElementById('dynamic-message').innerText = "";
                return;
            }

            // Time calculations to fix the broken script
            const distance = targetDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Output the result and force double digits (e.g. 09 instead of 9)
            document.getElementById("days").innerHTML = days.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = hours.toString().padStart(2, '0');
            document.getElementById("mins").innerHTML = minutes.toString().padStart(2, '0');
            document.getElementById("secs").innerHTML = seconds.toString().padStart(2, '0');
            
        }, 1000);
    </script>
</body>
</html>
